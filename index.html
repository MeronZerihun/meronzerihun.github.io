<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Under Construction</title>
        <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 1.5rem;
    }
    .card {
      max-width: 480px;
      width: 100%;
    }
    .badge {
      display: inline-block;
      background-color: #38bdf8;
      color: #0f172a;
      font-weight: 700;
      font-size: 0.75rem;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    h1 {
      font-size: 2.25rem;
      margin-bottom: 1rem;
      font-weight: 700;
      line-height: 1.2;
    }
    p {
      color: #94a3b8;
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .contact {
      font-size: 0.9rem;
      color: #64748b;
    }
    .contact a {
      color: #38bdf8;
      text-decoration: none;
    }
    .contact a:hover {
      text-decoration: underline;
    }
  </style>
    </head>
    <body>
        <div class="card">
            <span class="badge">Coming Soon</span>
            <h1>Under Construction</h1>
            <p>We're currently working on something new. Check back soon for
                updates!</p>
            <div class="contact">
                Questions? Reach out at <a
                    href="mailto:mdemissi@umich.edu">mdemissi@umich.edu</a>
            </div>
        </div>
    </body>
</html>
